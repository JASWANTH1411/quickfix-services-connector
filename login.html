<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - QuickFix</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
    <div class="container">
      <a class="navbar-brand navbar-brand-logo" href="/index.html"><i class="fa-solid fa-wrench text-primary"></i> QuickFix</a>
    </div>
  </nav>

  <div class="container d-flex align-items-center justify-content-center min-vh-100" style="padding-top: 100px;">
    <div class="card glass-card p-4 p-md-5 shadow-lg border-0" style="max-width: 480px; width: 100%;">
      <div class="text-center mb-4">
        <div class="navbar-brand-logo justify-content-center fs-2 mb-1"><i class="fa-solid fa-wrench text-primary"></i> QuickFix</div>
        <p class="text-muted small">Sign in to your QuickFix Account</p>
      </div>

      <!-- User Role Selector Tabs -->
      <ul class="nav nav-pills nav-justified mb-4 bg-light p-1 rounded-pill" id="roleTabs">
        <li class="nav-item">
          <button class="nav-link active rounded-pill fw-bold" onclick="selectRole('customer', this)"><i class="fa-solid fa-user me-1"></i> Customer</button>
        </li>
        <li class="nav-item">
          <button class="nav-link rounded-pill fw-bold" onclick="selectRole('worker', this)"><i class="fa-solid fa-screwdriver-wrench me-1"></i> Worker</button>
        </li>
        <li class="nav-item">
          <button class="nav-link rounded-pill fw-bold" onclick="selectRole('admin', this)"><i class="fa-solid fa-user-shield me-1"></i> Admin</button>
        </li>
      </ul>

      <form id="login-form" onsubmit="handleLoginSubmit(event)">
        <input type="hidden" id="selected-role" value="customer">

        <div class="mb-3">
          <label class="form-label fw-semibold">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
            <input type="email" id="login-email" class="form-control border-start-0 ps-0" placeholder="name@example.com" required>
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center">
            <label class="form-label fw-semibold">Password</label>
            <a href="#" class="small text-primary text-decoration-none fw-bold" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">Forgot?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
            <input type="password" id="login-password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary-custom w-100 py-3 mt-3 fw-bold fs-6">Sign In</button>
      </form>

      <div class="text-center mt-4 pt-3 border-top">
        <span class="text-muted small">Don't have an account?</span>
        <a href="/register.html" class="fw-bold text-primary text-decoration-none ms-1">Register Now</a>
      </div>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal fade" id="forgotPasswordModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content glass-card p-3">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold">Reset Password</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="small text-muted mb-3">Enter your registered email to receive a password reset OTP.</p>
          <div class="mb-3">
            <input type="email" id="forgot-email" class="form-control" placeholder="Enter email address">
          </div>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-primary-custom w-100" onclick="handleForgotPassword()">Send OTP Code</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const role = urlParams.get('role');
      if (role && ['worker', 'admin'].includes(role)) {
        const btn = document.querySelectorAll('#roleTabs button')[role === 'worker' ? 1 : 2];
        selectRole(role, btn);
      }
    });

    function selectRole(role, btn) {
      document.querySelectorAll('#roleTabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('selected-role').value = role;

      if (role === 'admin') {
        document.getElementById('login-email').value = 'j21137202@gmail.com';
        document.getElementById('login-password').value = 'password123';
      }
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const role = document.getElementById('selected-role').value;
      const btn = document.getElementById('login-btn');

      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Signing in...`;

      try {
        const res = await fetchAPI('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password, role })
        });

        AuthManager.setUserSession(res.data.token, res.data.user);
        showToast('success', 'Login Successful!');

        setTimeout(() => {
          if (role === 'worker') window.location.href = '/worker/dashboard.html';
          else if (role === 'admin') window.location.href = '/admin/dashboard.html';
          else window.location.href = '/customer/dashboard.html';
        }, 800);
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = `Sign In`;
        showAlert('Login Failed', err.message, 'error');
      }
    }

    async function handleForgotPassword() {
      const email = document.getElementById('forgot-email').value;
      if (!email) return showAlert('Error', 'Please enter email address', 'warning');

      try {
        const res = await fetchAPI('/auth/forgot-password', {
          method: 'POST',
          body: JSON.stringify({ email })
        });
        showAlert('OTP Sent', `Password reset OTP: ${res.data.demo_otp}`, 'info');
      } catch (err) {
        showAlert('Error', err.message, 'error');
      }
    }
  </script>
</body>
</html>
