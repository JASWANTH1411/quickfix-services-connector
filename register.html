<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account - QuickFix</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
    <div class="container">
      <a class="navbar-brand navbar-brand-logo" href="/index.html"><i class="fa-solid fa-wrench text-primary"></i> QuickFix</a>
    </div>
  </nav>

  <div class="container d-flex align-items-center justify-content-center min-vh-100" style="padding-top: 100px; padding-bottom: 50px;">
    <div class="card glass-card p-4 p-md-5 shadow-lg border-0" style="max-width: 600px; width: 100%;">
      <div class="text-center mb-4">
        <h3 class="fw-bold">Create QuickFix Account</h3>
        <p class="text-muted small">Join thousands of customers and skilled service partners</p>
      </div>

      <!-- User Type Tabs -->
      <ul class="nav nav-pills nav-justified mb-4 bg-light p-1 rounded-pill" id="registerTabs">
        <li class="nav-item">
          <button class="nav-link active rounded-pill fw-bold" onclick="selectType('customer', this)"><i class="fa-solid fa-user me-1"></i> Customer Account</button>
        </li>
        <li class="nav-item">
          <button class="nav-link rounded-pill fw-bold" onclick="selectType('worker', this)"><i class="fa-solid fa-screwdriver-wrench me-1"></i> Service Partner</button>
        </li>
      </ul>

      <form id="register-form" onsubmit="handleRegisterSubmit(event)">
        <input type="hidden" id="account-type" value="customer">

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Full Name *</label>
            <input type="text" id="reg-name" class="form-control" placeholder="John Doe" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Mobile Phone Number *</label>
            <input type="tel" id="reg-phone" class="form-control" placeholder="9876543210" required>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Email Address *</label>
            <input type="email" id="reg-email" class="form-control" placeholder="john@example.com" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Password *</label>
            <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" required minlength="6">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">City</label>
            <input type="text" id="reg-city" class="form-control" placeholder="Mumbai" value="Mumbai">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Full Address</label>
            <input type="text" id="reg-address" class="form-control" placeholder="Street, Flat no, Landmark">
          </div>

          <!-- Worker Specific Fields -->
          <div id="worker-fields" class="d-none col-12">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Primary Skill Category *</label>
                <select id="reg-category" class="form-select">
                  <!-- Dynamic Categories -->
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Years of Experience</label>
                <input type="number" id="reg-experience" class="form-control" value="2" min="0">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Hourly Rate (₹)</label>
                <input type="number" id="reg-rate" class="form-control" value="350">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Profile Photo</label>
                <input type="file" id="reg-avatar" class="form-control" accept="image/*">
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold">Short Bio / Expertise</label>
                <textarea id="reg-bio" class="form-control" rows="2" placeholder="Briefly describe your skill background..."></textarea>
              </div>
            </div>
          </div>
        </div>

        <button type="submit" id="reg-btn" class="btn btn-primary-custom w-100 py-3 mt-4 fw-bold fs-6">Complete Registration</button>
      </form>

      <div class="text-center mt-4 pt-3 border-top">
        <span class="text-muted small">Already have an account?</span>
        <a href="/login.html" class="fw-bold text-primary text-decoration-none ms-1">Sign In</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('role') === 'worker') {
        selectType('worker', document.querySelectorAll('#registerTabs button')[1]);
      }
      await loadCategories();
    });

    async function loadCategories() {
      try {
        const res = await fetchAPI('/services/categories');
        const sel = document.getElementById('reg-category');
        if (res.data) {
          sel.innerHTML = res.data.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        }
      } catch (err) {
        console.error(err);
      }
    }

    function selectType(type, btn) {
      document.querySelectorAll('#registerTabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('account-type').value = type;

      const workerFields = document.getElementById('worker-fields');
      if (type === 'worker') {
        workerFields.classList.remove('d-none');
      } else {
        workerFields.classList.add('d-none');
      }
    }

    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const type = document.getElementById('account-type').value;
      const btn = document.getElementById('reg-btn');

      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Creating Account...`;

      try {
        if (type === 'worker') {
          const formData = new FormData();
          formData.append('name', document.getElementById('reg-name').value);
          formData.append('email', document.getElementById('reg-email').value);
          formData.append('password', document.getElementById('reg-password').value);
          formData.append('phone', document.getElementById('reg-phone').value);
          formData.append('city', document.getElementById('reg-city').value);
          formData.append('address', document.getElementById('reg-address').value);
          formData.append('category_id', document.getElementById('reg-category').value);
          formData.append('experience_years', document.getElementById('reg-experience').value);
          formData.append('hourly_rate', document.getElementById('reg-rate').value);
          formData.append('bio', document.getElementById('reg-bio').value);

          const avatarFile = document.getElementById('reg-avatar').files[0];
          if (avatarFile) formData.append('avatar', avatarFile);

          const res = await fetchAPI('/auth/register/worker', {
            method: 'POST',
            body: formData
          });

          AuthManager.setUserSession(res.data.token, res.data.user);
          showAlert('Worker Account Created!', 'Please submit your verification documents on your dashboard to start receiving jobs.', 'success').then(() => {
            window.location.href = '/worker/dashboard.html';
          });
        } else {
          const body = {
            name: document.getElementById('reg-name').value,
            email: document.getElementById('reg-email').value,
            password: document.getElementById('reg-password').value,
            phone: document.getElementById('reg-phone').value,
            city: document.getElementById('reg-city').value,
            address: document.getElementById('reg-address').value
          };

          const res = await fetchAPI('/auth/register/customer', {
            method: 'POST',
            body: JSON.stringify(body)
          });

          AuthManager.setUserSession(res.data.token, res.data.user);
          showToast('success', 'Customer Account Created!');
          setTimeout(() => window.location.href = '/customer/dashboard.html', 800);
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = `Complete Registration`;
        showAlert('Registration Failed', err.message, 'error');
      }
    }
  </script>
</body>
</html>
