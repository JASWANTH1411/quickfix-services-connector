<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Service - QuickFix</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
    <div class="container">
      <a class="navbar-brand navbar-brand-logo" href="/index.html"><i class="fa-solid fa-wrench text-primary"></i> QuickFix</a>
      <div id="nav-auth-container" class="ms-auto"></div>
    </div>
  </nav>

  <div class="container py-5" style="margin-top: 80px;">
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="card glass-card p-4 p-md-5">
          <h3 class="fw-bold mb-4"><i class="fa-solid fa-calendar-check text-primary me-2"></i> Create Booking Request</h3>

          <form id="booking-form" onsubmit="handleBookingSubmit(event)">
            <!-- Category & Service Selector -->
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Service Category *</label>
                <select id="book-category" class="form-select" onchange="onCategoryChanged(this.value)">
                  <!-- Dynamic Categories -->
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Specific Repair Service *</label>
                <select id="book-service" class="form-select" onchange="onServiceChanged()">
                  <!-- Dynamic Services -->
                </select>
              </div>
            </div>

            <!-- Booking Type Toggle -->
            <div class="mb-4">
              <label class="form-label fw-semibold">Booking Schedule *</label>
              <div class="btn-group w-100" role="group">
                <input type="radio" class="btn-check" name="booking_type" id="type-instant" value="instant" checked onclick="toggleScheduleFields(false)">
                <label class="btn btn-outline-primary py-2 fw-bold" for="type-instant"><i class="fa-solid fa-bolt me-1"></i> Instant Emergency Booking (15 Mins)</label>

                <input type="radio" class="btn-check" name="booking_type" id="type-scheduled" value="scheduled" onclick="toggleScheduleFields(true)">
                <label class="btn btn-outline-primary py-2 fw-bold" for="type-scheduled"><i class="fa-solid fa-clock me-1"></i> Schedule Later</label>
              </div>
            </div>

            <!-- Scheduled Date & Time (Hidden by default) -->
            <div id="schedule-fields" class="row g-3 mb-4 d-none">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Preferred Date</label>
                <input type="date" id="book-date" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Preferred Time Slot</label>
                <input type="time" id="book-time" class="form-control">
              </div>
            </div>

            <!-- Problem Description & Photos -->
            <div class="mb-4">
              <label class="form-label fw-semibold">Problem Description</label>
              <textarea id="book-problem" class="form-control" rows="3" placeholder="Describe what issue you are facing (e.g. Ceiling fan humming loudly, water leaking from pipe joint)..."></textarea>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold">Upload Photo of Damage / Issue (Optional)</label>
              <input type="file" id="book-photos" class="form-control" multiple accept="image/*">
            </div>

            <!-- Customer Location Pin Drop & Pincode -->
            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <label class="form-label fw-semibold mb-0">Service Address & Area Pincode *</label>
                <button type="button" class="btn btn-sm btn-outline-primary rounded-pill" onclick="detectCurrentLocation()"><i class="fa-solid fa-location-crosshairs me-1"></i> Use Current GPS Location</button>
              </div>

              <div class="row g-2 mb-2">
                <div class="col-md-7">
                  <input type="text" id="book-address" class="form-control" placeholder="Street, flat no, landmark..." required>
                </div>
                <div class="col-md-3">
                  <input type="text" id="book-city" class="form-control" placeholder="City" value="Mumbai" required>
                </div>
                <div class="col-md-2">
                  <input type="text" id="book-pincode" class="form-control fw-bold text-center" placeholder="Pincode" value="400001" required>
                </div>
              </div>

              <input type="hidden" id="book-lat" value="19.0760">
              <input type="hidden" id="book-lng" value="72.8777">

              <div id="booking-map" style="height: 200px;" class="rounded-3 overflow-hidden border"></div>
            </div>

            <button type="submit" id="submit-booking-btn" class="btn btn-primary-custom w-100 py-3 fw-bold fs-6">Confirm & Request Nearby Worker</button>
          </form>
        </div>
      </div>

      <!-- Booking Order Summary & Coupon -->
      <div class="col-lg-4">
        <div class="card glass-card p-4 sticky-top" style="top: 100px;">
          <h5 class="fw-bold mb-3"><i class="fa-solid fa-receipt text-primary me-2"></i> Price Breakdown</h5>
          
          <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Base Service Rate:</span>
            <span id="summary-base" class="fw-bold">₹0.00</span>
          </div>

          <div class="d-flex justify-content-between mb-2 text-success d-none" id="discount-row">
            <span>Coupon Discount:</span>
            <span id="summary-discount" class="fw-bold">-₹0.00</span>
          </div>

          <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">GST & Platform Tax (18%):</span>
            <span id="summary-tax" class="fw-bold">₹0.00</span>
          </div>

          <hr>

          <div class="d-flex justify-content-between mb-4">
            <span class="fw-bold fs-5">Total Payable:</span>
            <span id="summary-total" class="fw-bold fs-4 text-primary">₹0.00</span>
          </div>

          <!-- Coupon Promo Code Form -->
          <div class="input-group mb-3">
            <input type="text" id="coupon-code-input" class="form-control text-uppercase fw-bold" placeholder="PROMO CODE">
            <button class="btn btn-outline-primary fw-bold" onclick="applyCoupon()">Apply</button>
          </div>
          <small class="text-muted d-block">Use coupon <strong class="text-primary">QUICK100</strong> for ₹100 OFF!</small>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/maps.js"></script>
  <script>
    let mapInstance = null;
    let selectedService = null;
    let currentDiscount = 0;
    let appliedCoupon = null;

    document.addEventListener('DOMContentLoaded', async () => {
      AuthManager.requireAuth('customer');
      initBookingMap();
      await loadCategories();

      const urlParams = new URLSearchParams(window.location.search);
      const catId = urlParams.get('category_id');
      const sId = urlParams.get('service_id');

      if (catId) {
        document.getElementById('book-category').value = catId;
        await onCategoryChanged(catId);
        if (sId) {
          document.getElementById('book-service').value = sId;
          onServiceChanged();
        }
      }
    });

    function initBookingMap() {
      mapInstance = new QuickFixMap('booking-map');
      mapInstance.initMap();
      detectCurrentLocation();
    }

    async function detectCurrentLocation() {
      const pos = await QuickFixMap.getCurrentUserLocation();
      document.getElementById('book-lat').value = pos.lat;
      document.getElementById('book-lng').value = pos.lng;
      if (mapInstance) {
        mapInstance.addMarker('user', pos, 'Service Location');
      }
      document.getElementById('book-address').value = `Juhu Beach Rd, Santacruz West, Mumbai (Lat: ${pos.lat.toFixed(4)}, Lng: ${pos.lng.toFixed(4)})`;
    }

    async function loadCategories() {
      try {
        const res = await fetchAPI('/services/categories');
        const catSelect = document.getElementById('book-category');
        if (res.data && res.data.length > 0) {
          catSelect.innerHTML = res.data.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
          await onCategoryChanged(res.data[0].id);
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function onCategoryChanged(catId) {
      try {
        const res = await fetchAPI(`/services/category/${catId}`);
        const sSelect = document.getElementById('book-service');
        if (res.data && res.data.length > 0) {
          sSelect.innerHTML = res.data.map(s => `<option value="${s.id}">${s.name} - ₹${s.price}</option>`).join('');
          onServiceChanged();
        } else {
          sSelect.innerHTML = `<option value="">No services in this category</option>`;
          updatePriceBreakdown(0);
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function onServiceChanged() {
      const catId = document.getElementById('book-category').value;
      const sId = document.getElementById('book-service').value;
      try {
        const res = await fetchAPI(`/services/category/${catId}`);
        if (res.data) {
          selectedService = res.data.find(s => s.id == sId);
          if (selectedService) {
            updatePriceBreakdown(parseFloat(selectedService.price));
          }
        }
      } catch (err) {
        console.error(err);
      }
    }

    function updatePriceBreakdown(basePrice) {
      const tax = (basePrice - currentDiscount) * 0.18;
      const total = basePrice - currentDiscount + tax;

      document.getElementById('summary-base').innerText = formatCurrency(basePrice);
      document.getElementById('summary-tax').innerText = formatCurrency(tax);
      document.getElementById('summary-total').innerText = formatCurrency(Math.max(0, total));

      if (currentDiscount > 0) {
        document.getElementById('discount-row').classList.remove('d-none');
        document.getElementById('summary-discount').innerText = `-${formatCurrency(currentDiscount)}`;
      } else {
        document.getElementById('discount-row').classList.add('d-none');
      }
    }

    function toggleScheduleFields(show) {
      const div = document.getElementById('schedule-fields');
      if (show) div.classList.remove('d-none');
      else div.classList.add('d-none');
    }

    function applyCoupon() {
      const code = document.getElementById('coupon-code-input').value.trim();
      if (code === 'QUICK100' || code === 'WELCOME50') {
        currentDiscount = 100;
        appliedCoupon = code;
        showToast('success', 'Coupon applied! ₹100 discount added.');
        if (selectedService) updatePriceBreakdown(parseFloat(selectedService.price));
      } else {
        showAlert('Invalid Coupon', 'Coupon code is not valid or expired.', 'error');
      }
    }

    async function handleBookingSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-booking-btn');
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Finding Nearby Online Workers...`;

      try {
        const formData = new FormData();
        formData.append('category_id', document.getElementById('book-category').value);
        formData.append('service_id', document.getElementById('book-service').value);
        formData.append('problem_description', document.getElementById('book-problem').value);
        formData.append('customer_address', document.getElementById('book-address').value);
        formData.append('customer_city', document.getElementById('book-city').value);
        formData.append('customer_pincode', document.getElementById('book-pincode').value);
        formData.append('latitude', document.getElementById('book-lat').value);
        formData.append('longitude', document.getElementById('book-lng').value);

        const bookingType = document.querySelector('input[name="booking_type"]:checked').value;
        formData.append('booking_type', bookingType);

        if (bookingType === 'scheduled') {
          formData.append('scheduled_date', document.getElementById('book-date').value);
          formData.append('scheduled_time', document.getElementById('book-time').value);
        }

        if (appliedCoupon) {
          formData.append('coupon_code', appliedCoupon);
        }

        const photoFiles = document.getElementById('book-photos').files;
        for (let i = 0; i < photoFiles.length; i++) {
          formData.append('problem_images', photoFiles[i]);
        }

        const res = await fetchAPI('/bookings', {
          method: 'POST',
          body: formData
        });

        showAlert(
          'Booking Created Successfully!',
          `Booking Code: ${res.data.booking_code}\nShare Start OTP: ${res.data.otp} when worker arrives.\nNotified ${res.data.nearby_workers_notified} nearby technicians.`,
          'success'
        ).then(() => {
          window.location.href = `/customer/dashboard.html?track=${res.data.booking_id}`;
        });

      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = `Confirm & Request Nearby Worker`;
        showAlert('Booking Error', err.message, 'error');
      }
    }
  </script>
</body>
</html>
