<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking History - QuickFix</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
    <div class="container">
      <a class="navbar-brand navbar-brand-logo" href="/index.html"><i class="fa-solid fa-wrench text-primary"></i> QuickFix</a>
      <div id="nav-auth-container" class="ms-auto"></div>
    </div>
  </nav>

  <div class="container py-5" style="margin-top: 80px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h3 class="fw-bold mb-0">My Booking History</h3>
        <p class="text-muted small">View active jobs, download invoices, and rate technicians</p>
      </div>
      <a href="/booking.html" class="btn btn-primary-custom px-4"><i class="fa-solid fa-plus me-2"></i> Book New Service</a>
    </div>

    <div class="card glass-card p-4">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Booking Code</th>
              <th>Service</th>
              <th>Date</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="history-table-body">
            <!-- Dynamic History Rows -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Rating Modal -->
  <div class="modal fade" id="ratingModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content glass-card p-3">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold">Rate Worker & Service</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center">
          <input type="hidden" id="rate-booking-id">
          <input type="hidden" id="rate-worker-id">
          <div class="fs-1 text-warning mb-3">
            <i class="fa-star fa-regular star-btn" onclick="setStar(1)"></i>
            <i class="fa-star fa-regular star-btn" onclick="setStar(2)"></i>
            <i class="fa-star fa-regular star-btn" onclick="setStar(3)"></i>
            <i class="fa-star fa-regular star-btn" onclick="setStar(4)"></i>
            <i class="fa-star fa-solid star-btn" onclick="setStar(5)"></i>
          </div>
          <input type="hidden" id="star-value" value="5">
          <textarea id="rate-comment" class="form-control" rows="3" placeholder="Write a review about your experience..."></textarea>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-primary-custom w-100" onclick="submitReview()">Submit Review</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      AuthManager.requireAuth('customer');
      await loadHistory();
    });

    async function loadHistory() {
      const tbody = document.getElementById('history-table-body');
      tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4"><div class="spinner-border text-primary"></div></td></tr>`;
      try {
        const res = await fetchAPI('/bookings/customer');
        if (res.data && res.data.length > 0) {
          tbody.innerHTML = res.data.map(b => `
            <tr>
              <td class="fw-bold text-primary">${b.booking_code}</td>
              <td>
                <div class="fw-bold">${b.service_name}</div>
                <small class="text-muted">${b.category_name}</small>
              </td>
              <td>${formatDate(b.created_at)}</td>
              <td class="fw-bold">${formatCurrency(b.total_amount)}</td>
              <td><span class="badge-status badge-${b.status}">${b.status.replace('_', ' ')}</span></td>
              <td>
                <div class="d-flex gap-2">
                  <a href="/customer/dashboard.html?track=${b.id}" class="btn btn-sm btn-outline-primary" title="Track Live Status"><i class="fa-solid fa-eye"></i> Track</a>
                  ${b.status === 'completed' ? `<a href="/api/payments/invoice/${b.id}" target="_blank" class="btn btn-sm btn-outline-secondary" title="Download Invoice"><i class="fa-solid fa-file-pdf text-danger me-1"></i> Invoice</a>` : ''}
                  ${b.status === 'completed' ? `<button class="btn btn-sm btn-outline-warning" onclick="openRatingModal(${b.id}, ${b.worker_id})"><i class="fa-solid fa-star"></i> Rate</button>` : ''}
                </div>
              </td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">No bookings found. <a href="/booking.html">Book your first service now!</a></td></tr>`;
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">${err.message}</td></tr>`;
      }
    }

    function openRatingModal(bookingId, workerId) {
      document.getElementById('rate-booking-id').value = bookingId;
      document.getElementById('rate-worker-id').value = workerId;
      new bootstrap.Modal(document.getElementById('ratingModal')).show();
    }

    function setStar(val) {
      document.getElementById('star-value').value = val;
      const stars = document.querySelectorAll('.star-btn');
      stars.forEach((s, idx) => {
        if (idx < val) s.className = 'fa-star fa-solid star-btn text-warning';
        else s.className = 'fa-star fa-regular star-btn text-muted';
      });
    }

    async function submitReview() {
      const booking_id = document.getElementById('rate-booking-id').value;
      const worker_id = document.getElementById('rate-worker-id').value;
      const rating = document.getElementById('star-value').value;
      const comment = document.getElementById('rate-comment').value;

      try {
        await fetchAPI('/reviews', {
          method: 'POST',
          body: JSON.stringify({ booking_id, worker_id, rating, comment })
        });
        showToast('success', 'Review submitted successfully!');
        bootstrap.Modal.getInstance(document.getElementById('ratingModal')).hide();
        loadHistory();
      } catch (err) {
        showAlert('Error', err.message, 'error');
      }
    }
  </script>
</body>
</html>
