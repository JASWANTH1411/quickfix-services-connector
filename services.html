<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services Catalog - QuickFix</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
    <div class="container">
      <a class="navbar-brand navbar-brand-logo" href="/index.html">
        <i class="fa-solid fa-wrench text-primary"></i> QuickFix
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link nav-link-custom" href="/index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link nav-link-custom active" href="/services.html">Services</a></li>
          <li class="nav-item"><a class="nav-link nav-link-custom" href="/about.html">About Us</a></li>
          <li class="nav-item"><a class="nav-link nav-link-custom" href="/contact.html">Contact</a></li>
        </ul>
        <div id="nav-auth-container" class="d-flex align-items-center"></div>
      </div>
    </div>
  </nav>

  <!-- Service Header -->
  <section class="hero-section text-center pb-4" style="padding-top: 120px;">
    <div class="container">
      <h1 class="fw-bold display-5 mb-3">All Home Services</h1>
      <p class="text-muted fs-5 mb-4">Choose from over 24+ professional home service categories</p>
      
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="input-group glass-card p-2">
            <span class="input-group-text bg-transparent border-0"><i class="fa-solid fa-search text-primary"></i></span>
            <input type="text" id="search-input" class="form-control border-0 bg-transparent" placeholder="Search service name, electrician, plumber..." onkeyup="filterServices()">
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Services & Categories Section -->
  <section class="py-5">
    <div class="container">
      <div class="row g-4">
        <!-- Categories Sidebar Filter -->
        <div class="col-lg-3">
          <div class="card glass-card p-3 sticky-top" style="top: 100px; z-index: 10;">
            <h5 class="fw-bold mb-3"><i class="fa-solid fa-filter text-primary me-2"></i> Categories</h5>
            <div class="list-group list-group-flush" id="category-filter-list">
              <button class="list-group-item list-group-item-action active rounded-3 mb-1" onclick="selectCategory('all', this)">All Categories</button>
              <!-- Dynamic Category Buttons -->
            </div>
          </div>
        </div>

        <!-- Services Cards Display -->
        <div class="col-lg-9">
          <div class="row g-4" id="services-grid">
            <!-- Dynamic Services Loaded Here -->
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    let allServices = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await loadCategoriesFilter();
      await loadServices();
    });

    async function loadCategoriesFilter() {
      try {
        const res = await fetchAPI('/services/categories');
        const container = document.getElementById('category-filter-list');
        if (res.data) {
          res.data.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'list-group-item list-group-item-action rounded-3 mb-1';
            btn.innerHTML = `<i class="fa-solid ${cat.icon} me-2 text-primary"></i> ${cat.name}`;
            btn.onclick = () => selectCategory(cat.id, btn);
            container.appendChild(btn);
          });
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function loadServices(catId = 'all') {
      const grid = document.getElementById('services-grid');
      grid.innerHTML = `<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>`;
      try {
        const endpoint = catId === 'all' ? '/services/search?query=' : `/services/category/${catId}`;
        const res = await fetchAPI(endpoint);
        allServices = res.data || [];
        renderServices(allServices);
      } catch (err) {
        grid.innerHTML = `<div class="alert alert-danger">Failed to load services.</div>`;
      }
    }

    function renderServices(services) {
      const grid = document.getElementById('services-grid');
      if (services.length === 0) {
        grid.innerHTML = `<div class="col-12 text-center py-5 text-muted"><h5>No services found matching your search.</h5></div>`;
        return;
      }

      grid.innerHTML = services.map(s => `
        <div class="col-md-6 col-lg-4">
          <div class="card glass-card h-100 p-3">
            <div class="d-flex align-items-center gap-3 mb-3">
              <div class="category-icon mb-0" style="width: 48px; height: 48px; font-size: 1.2rem;">
                <i class="fa-solid ${s.category_icon || 'fa-tools'}"></i>
              </div>
              <div>
                <span class="badge bg-primary-subtle text-primary fw-bold">${s.category_name || 'Home Service'}</span>
                <h6 class="fw-bold mb-0 mt-1">${s.name}</h6>
              </div>
            </div>
            <p class="small text-muted mb-3 flex-grow-1">${s.description || 'Professional technician service with 100% satisfaction guarantee.'}</p>
            <div class="d-flex align-items-center justify-content-between pt-2 border-top">
              <div>
                <small class="text-muted d-block">Starting From</small>
                <span class="fw-bold fs-5 text-primary">₹${parseFloat(s.price).toFixed(2)}</span>
              </div>
              <a href="/booking.html?service_id=${s.id}&category_id=${s.category_id}" class="btn btn-primary-custom px-3 btn-sm">Book Now</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterServices() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const filtered = allServices.filter(s => s.name.toLowerCase().includes(q) || (s.category_name && s.category_name.toLowerCase().includes(q)));
      renderServices(filtered);
    }

    function selectCategory(catId, btnElement) {
      document.querySelectorAll('#category-filter-list button').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      loadServices(catId);
    }
  </script>
</body>
</html>
